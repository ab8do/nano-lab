name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q software app

  arduino:
    name: Compile sketches (Arduino Nano)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:nano
          sketch-paths: |
            - firmware/dino/dino_game
            - firmware/gesture-games/gesture_games
            - firmware/robo-face/smart_face_v3
          libraries: |
            - name: U8g2
          enable-deltas-report: false
