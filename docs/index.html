<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nano Lab</title>
<meta name="description" content="Dino, Gesture Games and Robo: three Arduino Nano + OLED projects controlled by hand gestures and voice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#e8f0f9; --bg2:#d9e6f5; --panel:rgba(255,255,255,.86); --panel2:rgba(255,255,255,.6);
  --line:rgba(8,48,98,.2); --text:#0a1f3d; --muted:#44607f;
  --yel:#ffc928; --onyel:#1c1500; --blue:#0a66c9; --onblue:#ffffff; --blueSoft:rgba(10,102,201,.1);
  --code:#0a1a30; --codeText:#d9eaff; --hot:#0a66c9;
  --font:'Readex Pro','Segoe UI',Tahoma,system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Consolas,'Courier New',monospace;
  --hdr:64px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#061a31; --bg2:#0a2748; --panel:rgba(7,30,58,.82); --panel2:rgba(7,30,58,.55);
    --line:rgba(110,190,255,.22); --text:#e7f2ff; --muted:#9ab6d6;
    --yel:#ffd21f; --onyel:#1c1500; --blue:#4cb8ff; --onblue:#031325; --blueSoft:rgba(76,184,255,.14);
    --code:#030d1a; --codeText:#d9eaff; --hot:#ffd21f;
  }
}
:root[data-theme="dark"]{
  --bg:#061a31; --bg2:#0a2748; --panel:rgba(7,30,58,.82); --panel2:rgba(7,30,58,.55);
  --line:rgba(110,190,255,.22); --text:#e7f2ff; --muted:#9ab6d6;
  --yel:#ffd21f; --onyel:#1c1500; --blue:#4cb8ff; --onblue:#031325; --blueSoft:rgba(76,184,255,.14);
  --code:#030d1a; --codeText:#d9eaff; --hot:#ffd21f;
}
html{scroll-padding-top:calc(var(--hdr) + env(safe-area-inset-top,0px) + 8px)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
:lang(ar) body,body:lang(ar){line-height:1.9}
:lang(ar) *{letter-spacing:0!important}
h1,h2,h3{font-weight:650;margin:0}
h3{font-size:1.12rem;margin-block-end:.7em}
p{margin:0 0 1em}
a{color:var(--blue)}
code,.mono{font-family:var(--mono);font-size:.88em;direction:ltr;unicode-bidi:isolate}
code{background:var(--blueSoft);padding:.1em .4em;border-radius:4px}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:4px}
.skip{position:absolute;inset-inline-start:8px;top:-60px;background:var(--yel);color:var(--onyel);padding:8px 14px;border-radius:8px;z-index:100;font-weight:600}
.skip:focus{top:calc(8px + env(safe-area-inset-top,0px))}

/* ---- header ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;min-height:var(--hdr);padding-inline:clamp(14px,3vw,32px);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-weight:700;letter-spacing:-.01em}
.logo{width:28px;height:28px}
.nav{display:flex;gap:2px;justify-content:center;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:.92rem;white-space:nowrap}
.nav a:hover{color:var(--text)}
.nav a[aria-current="true"]{color:var(--text);background:var(--blueSoft);box-shadow:inset 0 -3px 0 var(--yel)}
.ctl{display:flex;gap:8px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-size:.85rem;padding:7px 11px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--yel);color:var(--onyel);font-weight:600}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}
@media (max-width:900px){
  .top{grid-template-columns:1fr auto;grid-template-areas:"brand ctl" "nav nav";gap:6px 12px;padding-block:8px}
  .brand{grid-area:brand}.ctl{grid-area:ctl}.nav{grid-area:nav;justify-content:flex-start}
}

/* ---- 3D scene ---- */
#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,footer{position:relative;z-index:1}
@media (max-width:900px){#scene{opacity:.5}}

/* ---- layout ---- */
.wrap{max-width:1200px;margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}
.sec{padding-block:clamp(52px,9vh,100px)}
.split{height:6px;background:linear-gradient(90deg,var(--yel) 0 25%,var(--blue) 25% 100%)}
:root[dir="rtl"] .split{transform:scaleX(-1)}
h2{font-size:clamp(1.7rem,3.4vw,2.6rem);line-height:1.18;letter-spacing:-.02em;max-inline-size:17em;margin-block-end:.5em}
.half{max-inline-size:min(34em,100%)}
.lead{font-size:1.15rem;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.two.gap-top{margin-top:24px}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;padding:clamp(16px,2.2vw,26px)}
.scroll{overflow-x:auto}
.cap{font-size:.9rem;color:var(--muted);margin-top:10px}
.files{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.files code{background:var(--yel);color:var(--onyel);font-weight:600;padding:.25em .6em;border-radius:6px}

/* ---- hero ---- */
.hero{min-height:calc(100svh - var(--hdr));display:flex;flex-direction:column;justify-content:space-between;padding-block:clamp(28px,8vh,80px) 28px}
.hero h1{font-size:clamp(2.3rem,5.8vw,4.5rem);line-height:1.08;letter-spacing:-.03em;font-weight:700;max-inline-size:12em;margin-block-end:.4em}
:lang(ar) .hero h1{line-height:1.3}
.hero .lead{max-inline-size:33em}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn{display:inline-block;padding:.8em 1.35em;border-radius:10px;font-weight:600;text-decoration:none;border:1px solid transparent;font:inherit;font-weight:600;cursor:pointer}
.btn.primary{background:var(--yel);color:var(--onyel)}
.btn.ghost{background:var(--panel2);color:var(--text);border-color:var(--line)}
.btn:hover{filter:brightness(1.07)}
.hero-foot{margin-top:40px}
.chips-label{font-size:.9rem;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.pill{font:inherit;font-size:.9rem;padding:.4em .95em;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
.chip[aria-pressed="true"],.pill[aria-pressed="true"],.pill[aria-selected="true"]{background:var(--blue);color:var(--onblue);border-color:transparent}
.note{font-size:.85rem;color:var(--muted);margin:12px 0 0;max-inline-size:44em}

/* ---- flow diagram ---- */
.flow{display:flex;align-items:stretch}
.node{flex:1;min-width:0;padding:16px 10px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-weight:600;font-size:.95rem;display:grid;place-items:center}
.node.nano{border-color:var(--yel);box-shadow:inset 0 0 0 1px var(--yel)}
.link{flex:0 0 clamp(26px,4vw,56px);position:relative}
.link::before{content:"";position:absolute;inset-inline:0;top:50%;height:2px;background:var(--line)}
.link i{position:absolute;top:calc(50% - 4px);width:8px;height:8px;border-radius:50%;background:var(--blue);inset-inline-start:0;animation:run 1.8s linear infinite}
.link:nth-of-type(4) i{background:var(--yel);animation-delay:-.6s}
@keyframes run{from{inset-inline-start:0}to{inset-inline-start:calc(100% - 8px)}}
@keyframes runY{from{top:0}to{top:calc(100% - 8px)}}
@media (max-width:760px){
  .flow{flex-direction:column}.link{flex:0 0 34px}
  .link::before{inset-inline:auto;inset-inline-start:calc(50% - 1px);top:0;bottom:0;width:2px;height:auto}
  .link i{inset-inline-start:calc(50% - 4px);top:0;animation-name:runY}
}
.travel{list-style:none;padding:0;margin:20px 0 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.travel li{padding:14px 16px;border-inline-start:4px solid var(--yel);background:var(--panel);border-radius:6px;font-size:.95rem}
.travel li:nth-child(2){border-inline-start-color:var(--blue)}
@media (max-width:900px){.travel{grid-template-columns:minmax(0,1fr)}}

/* ---- tables / lists ---- */
.tbl{width:100%;border-collapse:collapse;font-size:.93rem}
.tbl th,.tbl td{padding:.65em .8em;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.tbl th{font-weight:600;color:var(--muted);font-size:.85rem}
.tbl tr[data-i]{cursor:default}
.tbl tr.hot{background:var(--blueSoft)}
.tbl tr.hot td:first-child{box-shadow:inset 3px 0 0 var(--hot)}
:root[dir="rtl"] .tbl tr.hot td:first-child{box-shadow:inset -3px 0 0 var(--hot)}
.sw{display:inline-block;width:.85em;height:.85em;border-radius:50%;margin-inline-end:.55em;vertical-align:-.08em;box-shadow:0 0 0 1px var(--line)}
.list{margin:0;padding-inline-start:1.2em;display:grid;gap:.55em}
.engines th:first-child,.engines td:first-child{color:var(--muted);font-weight:500;white-space:nowrap}
.engines{min-width:720px}

/* ---- steps / spec ---- */
ol.steps{list-style:none;counter-reset:s;padding:0;margin:0;display:grid;gap:14px}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:2.8em}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:.1em;width:1.9em;height:1.9em;border-radius:50%;background:var(--yel);color:var(--onyel);display:grid;place-items:center;font-weight:700;font-size:.9rem;line-height:1}
dl.spec{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:.7em 1.2em;margin:0}
dl.spec dt{font-weight:600;color:var(--blue)}
:root:not([data-theme="light"]) dl.spec dt{color:var(--blue)}
dl.spec dd{margin:0}
@media (max-width:560px){dl.spec{grid-template-columns:minmax(0,1fr)}dl.spec dt{margin-top:.5em}}

/* ---- OLED bezel ---- */
.oled{margin:0;background:#03060b;padding:10px;border-radius:14px;border:1px solid var(--line);box-shadow:inset 0 0 0 2px #0f1623}
.oled canvas{display:block;width:100%;height:auto;aspect-ratio:2/1;image-rendering:pixelated;border-radius:4px;background:#000}
.oled canvas:focus-visible{outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* ---- games ---- */
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:24px}
.gcard{border:1px solid var(--line);border-radius:10px;padding:16px 16px 18px;background:var(--panel)}
.gcard h3{display:flex;align-items:center;gap:12px;margin-bottom:.4em}
.gcard svg.hand{width:64px;height:64px;flex:0 0 64px;color:var(--text)}
.gcard p{margin:0 0 .6em;font-size:.94rem}
.gcard .nums{color:var(--muted);font-size:.88rem}
.hand .fill{fill:var(--yel)}.hand .st{stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hand .arrow{stroke:var(--blue);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.hand .skin{fill:var(--panel2);stroke:currentColor;stroke-width:2}

/* ---- wiring svg ---- */
#wireSvg{display:block;max-width:100%;height:auto}
#wireSvg .w{opacity:.92;cursor:pointer;transition:opacity .15s,stroke-width .15s}
#wireSvg.dim .w{opacity:.18}
#wireSvg.dim .w.hot{opacity:1;stroke-width:7}
#wireSvg text{font-family:var(--mono);font-size:13px;fill:#d7e6fa}
#wireSvg .cap{font-family:var(--font);font-size:12px;fill:#8fb0d6}
.hand .up{fill:var(--yel)}
/* ---- gallery ---- */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0 28px}
.gcell{font:inherit;color:var(--text);padding:6px 6px 8px;border:1px solid var(--line);border-radius:10px;background:#03060b;cursor:pointer;text-align:center}
.gcell canvas{display:block;width:100%;aspect-ratio:2/1;image-rendering:pixelated;border-radius:4px}
.gcell span{display:block;margin-top:6px;font-size:.85rem;color:#c7d7ec}
.gcell[aria-pressed="true"]{outline:3px solid var(--yel);outline-offset:1px}

/* ---- code / tabs / faq ---- */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{font:inherit;padding:.7em 1.2em;border:0;background:transparent;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--text);font-weight:600;border-bottom-color:var(--yel)}
.codewrap{position:relative;direction:ltr;margin:.6em 0 0}
.codewrap .lbl{display:block;font-size:.8rem;color:var(--muted);margin:.8em 0 .2em;direction:inherit}
.code{background:var(--code);color:var(--codeText);border-radius:8px;padding:12px 76px 12px 14px;font:13px/1.6 var(--mono);overflow-x:auto;white-space:pre;text-align:left;margin:0}
.copy{position:absolute;right:8px;bottom:8px;font:inherit;font-size:.78rem;padding:.3em .8em;border-radius:6px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;cursor:pointer}
.copy.done{background:var(--yel);color:var(--onyel);border-color:transparent}
.setup-steps{margin:0}
details{border-bottom:1px solid var(--line);padding:2px 0}
summary{cursor:pointer;padding:.9em .2em;font-weight:600;list-style-position:inside}
details p{margin:0 0 1em;padding-inline-start:.4em;color:var(--muted)}
footer{padding:36px clamp(16px,4vw,40px) 44px;color:var(--muted);font-size:.9rem;text-align:center;background:var(--panel);border-top:1px solid var(--line)}
noscript p{padding:24px;text-align:center}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main" data-t="skip">Skip to content</a>
<header class="top" id="top">
  <a class="brand" href="#hero" aria-label="Nano Lab">
    <svg class="logo" viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges"><rect width="16" height="16" rx="3" fill="#03060b"/><rect x="2" y="2" width="5" height="4" fill="#ffd21f"/><rect x="9" y="2" width="5" height="4" fill="#ffd21f"/><rect x="2" y="8" width="12" height="2" fill="#46b4ff"/><rect x="4" y="11" width="8" height="2" fill="#46b4ff"/></svg>
    <span>Nano Lab</span>
  </a>
  <nav class="nav" id="nav" aria-label="Main">
    <a href="#how" data-nav="how" data-t="navHow">How it works</a>
    <a href="#wiring" data-nav="wiring" data-t="navWiring">Wiring</a>
    <a href="#dino" data-nav="dino" data-t="navDino">Dino</a>
    <a href="#games" data-nav="games" data-t="navGames">Games</a>
    <a href="#robo" data-nav="robo" data-t="navRobo">Robo</a>
    <a href="#setup" data-nav="setup" data-t="navSetup">Setup</a>
    <a href="#faq" data-nav="faq" data-t="navFaq">Help</a>
  </nav>
  <div class="ctl">
    <div class="seg" role="group" aria-label="Language" id="langSeg">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="fr" aria-pressed="false">FR</button>
      <button type="button" data-lang="ar" aria-pressed="false">AR</button>
    </div>
    <button type="button" class="icon-btn" id="themeBtn" aria-label="Switch theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<canvas id="scene" aria-hidden="true"></canvas>

<main id="main">
  <section id="hero" class="hero" aria-labelledby="hero-h">
    <div class="wrap">
      <h1 id="hero-h" data-t="heroTitle"></h1>
      <p class="lead" data-t="heroSub"></p>
      <div class="cta">
        <a class="btn primary" href="#dino" data-t="ctaProjects"></a>
        <a class="btn ghost" href="#wiring" data-t="ctaWiring"></a>
      </div>
      <div class="hero-foot">
        <p class="chips-label" data-t="chipsLabel"></p>
        <div class="chips" id="chips" role="group"></div>
        <p class="note" data-t="heroNote"></p>
      </div>
    </div>
  </section>
  <div class="split" aria-hidden="true"></div>

  <section id="how" class="sec" aria-labelledby="how-h">
    <div class="wrap">
      <h2 id="how-h" data-t="howTitle"></h2>
      <p class="half" data-t="howP"></p>
      <div class="panel"><div class="flow" id="flow"></div></div>
      <ul class="travel" id="travel"></ul>
    </div>
  </section>
  <div class="split" aria-hidden="true"></div>

  <section id="wiring" class="sec" aria-labelledby="wir-h">
    <div class="wrap">
      <h2 id="wir-h" data-t="wirTitle"></h2>
      <p class="half" data-t="wirP"></p>
      <div class="two">
        <div class="panel" style="direction:ltr"><svg id="wireSvg" viewBox="0 0 680 330" width="100%" role="img"></svg></div>
        <div class="panel"><div class="scroll"><table class="tbl" id="wireTbl"></table></div></div>
      </div>
      <div class="two gap-top">
        <div class="panel"><h3 data-t="partsH"></h3><ul class="list" id="parts"></ul></div>
        <div class="panel"><h3 data-t="notesH"></h3><ul class="list" id="wnotes"></ul></div>
      </div>
    </div>
  </section>
  <div class="split" aria-hidden="true"></div>

  <section id="dino" class="sec" aria-labelledby="dino-h">
    <div class="wrap">
      <h2 id="dino-h" data-t="dinoTitle"></h2>
      <p class="half" data-t="dinoP"></p>
      <div class="two">
        <div>
          <figure class="oled"><canvas id="cvDino" tabindex="0" role="img"></canvas></figure>
          <div class="row">
            <button type="button" class="pill" id="dinoJump" data-t="jump"></button>
            <button type="button" class="pill" id="dinoAuto" aria-pressed="true" data-t="auto"></button>
          </div>
          <p class="cap" data-t="dinoCap"></p>
        </div>
        <div class="panel"><h3 data-t="howH"></h3><ol class="steps" id="dinoSteps"></ol></div>
      </div>
      <div class="two gap-top">
        <div class="panel"><h3 data-t="specH"></h3><dl class="spec" id="dinoSpec"></dl></div>
        <div class="panel"><h3 data-t="lessonH"></h3><p data-t="dinoLesson"></p><p class="files" id="dinoFiles"></p></div>
      </div>
    </div>
  </section>
  <div class="split" aria-hidden="true"></div>

  <section id="games" class="sec" aria-labelledby="games-h">
    <div class="wrap">
      <h2 id="games-h" data-t="gamesTitle"></h2>
      <p class="half" data-t="gamesP"></p>
      <div class="two">
        <div>
          <figure class="oled"><canvas id="cvGame" role="img"></canvas></figure>
          <div class="row" id="gameTabs" role="group"></div>
          <p class="cap" data-t="gameCap"></p>
        </div>
        <div class="panel"><h3 data-t="protoH"></h3><div id="gProto"></div></div>
      </div>
      <div class="games" id="gCards"></div>
      <div class="two gap-top">
        <div class="panel"><h3 data-t="menuH"></h3><p data-t="menuP"></p><div style="display:flex;gap:10px;flex-wrap:wrap" id="menuHands" aria-hidden="true"></div></div>
        <div class="panel"><h3 data-t="fingH"></h3><p data-t="fingP"></p><h3 data-t="memH" style="margin-top:1em"></h3><p data-t="memP"></p><p class="files" id="gamesFiles"></p></div>
      </div>
    </div>
  </section>
  <div class="split" aria-hidden="true"></div>

  <section id="robo" class="sec" aria-labelledby="robo-h">
    <div class="wrap">
      <h2 id="robo-h" data-t="roboTitle"></h2>
      <p class="half" data-t="roboP"></p>
      <div class="two">
        <div>

skip:L("Skip to content","Aller au contenu","انتقل إلى المحتوى"),

copied:L("Copied","Copié","تم النسخ"),
docTitle:L("Nano Lab: Dino, Gesture Games and Robo","Nano Lab : Dino, Gesture Games et Robo","Nano Lab: الداينو وألعاب الإيماءات وروبو"),

heroTitle:L("Your hand and your voice, on a 0.96-inch screen.","Votre main et votre voix, sur un écran de 0,96 pouce.","يدك وصوتك، على شاشة بحجم 0.96 بوصة."),
heroSub:L("Three projects for the Arduino Nano: a dinosaur that jumps when you raise your hand, four arcade games steered by gestures, and Robo, a talking face that looks at you.","Trois projets pour l'Arduino Nano : un dinosaure qui saute quand vous levez la main, quatre jeux d'arcade pilotés par gestes, et Robo, un visage qui parle et vous regarde.","ثلاثة مشاريع لأردوينو نانو: ديناصور يقفز عندما ترفع يدك، وأربع ألعاب تتحكم بها بالإيماءات، وروبو، وجه يتحدث وينظر إليك."),
ctaProjects:L("Meet the projects","Découvrir les projets","تعرّف على المشاريع"),
ctaWiring:L("See the wiring","Voir le câblage","شاهد التوصيل"),
chipsLabel:L("Show on the 3D screen","Afficher sur l'écran 3D","اعرض على الشاشة ثلاثية الأبعاد"),
heroNote:L("Move your mouse over the scene. Every screen on this page is a simulation drawn in your browser, not a recording of the real board.","Bougez la souris sur la scène. Chaque écran de cette page est une simulation dessinée dans votre navigateur, pas un enregistrement de la vraie carte.","حرّك الفأرة فوق المشهد. كل شاشة في هذه الصفحة محاكاة مرسومة داخل متصفحك، وليست تسجيلًا للوحة الحقيقية."),

howTitle:L("The laptop sees and hears. The Arduino shows.","Le portable voit et écoute. L'Arduino affiche.","الحاسوب يرى ويسمع. والأردوينو يعرض."),
howP:L("An Arduino Nano has 2 KB of RAM, far too little for a camera or speech. So the laptop does the heavy work (webcam, hand tracking, microphone, AI) and sends tiny messages over the USB cable. The Nano only runs the game logic and draws on the OLED.","Un Arduino Nano n'a que 2 Ko de RAM, bien trop peu pour une caméra ou la parole. Le portable fait donc le gros du travail (webcam, suivi de la main, micro, IA) et envoie de petits messages par le câble USB. Le Nano se contente de la logique du jeu et de l'affichage sur l'OLED.","ذاكرة أردوينو نانو 2 كيلوبايت فقط، وهذا لا يكفي لكاميرا أو لمعالجة الكلام. لذلك يقوم اللابتوب بالعمل الثقيل (الكاميرا وتتبع اليد والميكروفون والذكاء الاصطناعي) ويرسل رسائل صغيرة عبر كابل USB، بينما يكتفي النانو بمنطق اللعبة والرسم على الشاشة."),
FLOW:[L("Webcam and microphone","Webcam et micro","الكاميرا والميكروفون"),L("Python on the laptop","Python sur le portable","بايثون على اللابتوب"),L("USB serial cable","Câble USB série","كابل USB التسلسلي"),L("Arduino Nano","Arduino Nano","أردوينو نانو"),L("OLED 128×64","OLED 128×64","شاشة OLED 128×64")],
TRAVEL:[
 L("<b>Dino</b> sends one letter, <code>J</code>, at 9600 baud.","<b>Dino</b> envoie une seule lettre, <code>J</code>, à 9600 bauds.","<b>الداينو</b> يرسل حرفًا واحدًا هو <code>J</code> بسرعة 9600 باود."),
 L("<b>Gesture Games</b> send a 4-byte packet about 30 times a second at 57600 baud.","<b>Gesture Games</b> envoient un paquet de 4 octets environ 30 fois par seconde à 57600 bauds.","<b>ألعاب الإيماءات</b> ترسل حزمة من 4 بايتات نحو 30 مرة في الثانية بسرعة 57600 باود."),
 L("<b>Robo</b> sends where to look, commands, mouth level and energy, also at 57600 baud.","<b>Robo</b> envoie le regard, des commandes, le niveau de la bouche et l'énergie, aussi à 57600 bauds.","<b>روبو</b> يرسل اتجاه النظر والأوامر ومستوى الفم والطاقة، بسرعة 57600 باود أيضًا.")],

wirTitle:L("Seven wires from the screen to the Nano","Sept fils entre l'écran et le Nano","سبعة أسلاك بين الشاشة والنانو"),
wirP:L("All three projects share this wiring. The screen speaks SPI, a fast four-wire protocol, so every wire must sit firmly in its hole. Hover a row to light up its wire.","Les trois projets partagent ce câblage. L'écran parle en SPI, un protocole rapide à quatre fils : chaque fil doit être bien enfoncé. Survolez une ligne pour éclairer son fil.","المشاريع الثلاثة تشترك في هذا التوصيل. الشاشة تتحدث ببروتوكول SPI السريع، لذلك يجب أن يكون كل سلك مثبتًا جيدًا في مكانه. مرّر المؤشر فوق صف لإضاءة سلكه."),
wirH:L(["Screen pin","Nano pin","Role"],["Broche écran","Broche Nano","Rôle"],["طرف الشاشة","طرف النانو","الدور"]),
WIRES:[
 {o:"GND",n:"GND",c:"#c8d3e0",r:L("Ground","Masse","الأرضي")},
 {o:"VCC",n:"5V",c:"#ff5a5f",r:L("Power, 5 V","Alimentation, 5 V","الكهرباء، 5 فولت")},
 {o:"D0 (CLK)",n:"D13",c:"#ffd21f",r:L("SPI clock","Horloge SPI","ساعة SPI")},
 {o:"D1 (MOSI)",n:"D11",c:"#46b4ff",r:L("Data sent to the screen","Données envoyées à l'écran","البيانات المرسلة إلى الشاشة")},
 {o:"RES",n:"D8",c:"#ff9f1a",r:L("Reset","Réinitialisation","إعادة التهيئة")},
 {o:"DC",n:"D9",c:"#3ddc97",r:L("Data or command","Donnée ou commande","بيانات أم أوامر")},
 {o:"CS",n:"D10",c:"#c084fc",r:L("Chip select","Sélection de la puce","اختيار الشريحة")}],
partsH:L("What you need","Ce qu'il vous faut","ما تحتاجه"),
PARTS:[
 L("Arduino Nano with its header pins soldered on","Arduino Nano avec ses broches soudées","أردوينو نانو مع لحام دبابيسه"),
 L("OLED 0.96 inch, 7 pins, SPI, two colours: 16 yellow rows on top, 48 blue rows below","OLED 0,96 pouce, 7 broches, SPI, deux couleurs : 16 lignes jaunes en haut, 48 bleues en dessous","شاشة OLED مقاس 0.96 بوصة بسبعة أطراف وSPI وبلونين: 16 صفًا أصفر في الأعلى و48 صفًا أزرق تحتها"),
 L("7 female-to-male jumper wires and a breadboard","7 fils Dupont femelle-mâle et une breadboard","7 أسلاك توصيل أنثى-ذكر ولوحة تجارب"),
 L("A soldering iron and solder","Un fer à souder et de l'étain","كاوية لحام وقصدير"),
 L("A USB cable, and a laptop with webcam and microphone","Un câble USB, et un portable avec webcam et micro","كابل USB وحاسوب محمول بكاميرا وميكروفون")],
notesH:L("Before you power it on","Avant de brancher","قبل التشغيل"),
WNOTES:[
 L("Unplug the USB cable before you touch the wires.","Débranchez le câble USB avant de toucher aux fils.","افصل كابل USB قبل لمس الأسلاك."),
 L("Solder the Nano's pins. Pins that are only pushed into the breadboard leave an air gap, and the screen stays black.","Soudez les broches du Nano. Des broches simplement enfoncées dans la breadboard laissent un jeu d'air, et l'écran reste noir.","الحم دبابيس النانو. الدبابيس المغروسة فقط في لوحة التجارب تترك فجوة هوائية فتبقى الشاشة سوداء."),
 L("Two colours are normal: the top 16 rows are yellow and the lower 48 are blue. The thin line between them is physical.","Deux couleurs, c'est normal : les 16 lignes du haut sont jaunes et les 48 du bas bleues. Le fin trait entre les deux est physique.","وجود لونين أمر طبيعي: الصفوف الـ16 العلوية صفراء والـ48 السفلية زرقاء. والخط الرفيع بينهما فاصل فيزيائي."),
 L("If the screen stays black after soldering, try the SH1106 line in the sketch: many 7-pin modules use that chip.","Si l'écran reste noir après soudure, essayez la ligne SH1106 du sketch : beaucoup de modules 7 broches utilisent cette puce.","إن بقيت الشاشة سوداء بعد اللحام فجرّب سطر SH1106 في الكود: كثير من الشاشات ذات 7 أطراف تستعمل هذه الشريحة.")],

jump:L("Jump","Sauter","اقفز"),
auto:L("Auto-play","Auto","لعب تلقائي"),
dinoTitle:L("Dino: jump by raising your hand","Dino : sautez en levant la main","الداينو: اقفز برفع يدك"),
dinoP:L("A Chrome-style dinosaur runs on the OLED. The laptop watches your hand and sends a single letter the moment you raise it.","Un dinosaure façon Chrome court sur l'OLED. Le portable surveille votre main et envoie une seule lettre à l'instant où vous la levez.","ديناصور بنمط كروم يركض على الشاشة. الحاسوب يراقب يدك ويرسل حرفًا واحدًا في لحظة رفعها."),
dinoCap:L("Click the screen, press Space (when it has focus) or tap Jump: that stands in for raising your hand.","Cliquez sur l'écran, appuyez sur Espace (quand il a le focus) ou sur Sauter : cela remplace le geste de lever la main.","انقر الشاشة أو اضغط مسافة (عندما تكون محددة) أو اضغط اقفز: هذا يحلّ محل رفع يدك."),
howH:L("How a jump happens","Comment naît un saut","كيف تحدث القفزة"),
DINO_STEPS:[
 L("The webcam image is mirrored, so your movements feel natural.","L'image de la webcam est inversée comme un miroir, vos gestes paraissent naturels.","صورة الكاميرا تُقلب كالمرآة فتبدو حركتك طبيعية."),
 L("MediaPipe Hands tracks 21 points on your hand.","MediaPipe Hands suit 21 points sur votre main.","مكتبة MediaPipe Hands تتتبع 21 نقطة على يدك."),
 L("The hand counts as raised when the index fingertip is higher than the wrist by more than 20% of the image height.","La main est « levée » quand le bout de l'index dépasse le poignet de plus de 20 % de la hauteur de l'image.","تُعتبر اليد مرفوعة عندما تعلو سبابتها المعصم بأكثر من 20% من ارتفاع الصورة."),
 L("At the moment you raise it, Python sends the letter <code>J</code> at 9600 baud. Keeping the hand up does not repeat the jump: lower it, then raise it again.","À l'instant où vous la levez, Python envoie la lettre <code>J</code> à 9600 bauds. Garder la main levée ne répète pas le saut : baissez-la puis relevez-la.","لحظة رفعها يرسل بايثون الحرف <code>J</code> بسرعة 9600 باود. إبقاء اليد مرفوعة لا يكرر القفز: اخفضها ثم ارفعها من جديد."),
 L("The Nano starts the jump. After Game Over, <code>J</code> restarts the game.","Le Nano lance le saut. Après Game Over, <code>J</code> relance la partie.","النانو يبدأ القفزة. وبعد Game Over يعيد الحرف <code>J</code> تشغيل اللعبة.")],
specH:L("Inside the game","Dans le jeu","داخل اللعبة"),
DINO_SPEC:[
 [L("Screen","Écran","الشاشة"),L("Score and best score in the yellow strip, the track in the blue area, ground line at row 58.","Score et meilleur score dans la bande jaune, la piste dans la zone bleue, ligne du sol à la ligne 58.","النتيجة وأفضل نتيجة في الشريط الأصفر، والمضمار في المنطقة الزرقاء، وخط الأرض عند الصف 58.")],
 [L("Dinosaur","Dinosaure","الديناصور"),L("A 16×16 pixel sprite. The legs swap every 4 frames while it runs.","Un sprite de 16×16 pixels. Les pattes alternent toutes les 4 images pendant la course.","رسمة 16×16 بكسل. تتبدل الأرجل كل 4 إطارات أثناء الركض.")],
 [L("Jump","Saut","القفز"),L("Launch speed −7 px per frame, gravity 0.8: about 17 frames (0.5 s) in the air, 31 px high.","Vitesse de départ −7 px par image, gravité 0,8 : environ 17 images (0,5 s) en l'air, 31 px de haut.","سرعة الانطلاق −7 بكسل للإطار والجاذبية 0.8: حوالي 17 إطارًا (نصف ثانية) في الهواء بارتفاع 31 بكسل.")],
 [L("Speed","Vitesse","السرعة"),L("3 px per frame at the start, rising with the score up to 5.5.","3 px par image au départ, jusqu'à 5,5 selon le score.","3 بكسل للإطار في البداية وتزيد مع النتيجة حتى 5.5.")],
 [L("Cacti","Cactus","الصبّار"),L("Small, tall or double. The gap between them grows with speed. Hitboxes are a pixel smaller than the drawing.","Petit, grand ou double. L'écart entre eux grandit avec la vitesse. Les zones de collision sont un pixel plus petites que le dessin.","صغير أو طويل أو مزدوج. تزيد المسافة بينها مع السرعة. مناطق التصادم أصغر من الرسم بكسلًا واحدًا.")],
 [L("Timing","Cadence","الإيقاع"),L("A new frame every 30 ms. The game waits on a start screen for your first raised hand, then the first cactus arrives after about 2 s.","Une image toutes les 30 ms. Le jeu attend votre première main levée, puis le premier cactus arrive après environ 2 s.","إطار جديد كل 30 مللي ثانية. تنتظر اللعبة أول يد مرفوعة، ثم يصل أول صبّار بعد ثانيتين تقريبًا.")]],
lessonH:L("A bug worth knowing","Un bug à connaître","خطأ يستحق أن تعرفه"),
dinoLesson:L("In the first version the dino stopped jumping even though the gesture was detected. The game had ended, and the sketch waited for an <code>R</code> command to restart that Python never sent. Now <code>J</code> also restarts the game, after a short lockout.","Dans la première version, le dino ne sautait plus alors que le geste était détecté. La partie était terminée et le sketch attendait une commande <code>R</code> que Python n'envoyait jamais. Désormais <code>J</code> relance aussi la partie, après un court délai.","في النسخة الأولى توقف الداينو عن القفز مع أن الإيماءة كانت تُكتشف. كانت اللعبة قد انتهت، والكود ينتظر أمر <code>R</code> لإعادة التشغيل لا يرسله بايثون أبدًا. الآن يعيد <code>J</code> التشغيل أيضًا بعد مهلة قصيرة."),

gamesTitle:L("Gesture Games: four arcade games, no buttons","Gesture Games : quatre jeux d'arcade, sans boutons","ألعاب الإيماءات: أربع ألعاب بلا أزرار"),
gamesP:L("One sketch holds a menu and four games. Python sends your palm position and finger count, and each game reads them in its own way.","Un seul sketch contient un menu et quatre jeux. Python envoie la position de la paume et le nombre de doigts, et chaque jeu les lit à sa façon.","برنامج واحد يضم قائمة وأربع ألعاب. بايثون يرسل موضع كفك وعدد أصابعك، وكل لعبة تقرؤهما بطريقتها."),
gameCap:L("These are autoplay bots standing in for your hand. Pick a game to watch it.","Ce sont des robots de démonstration qui remplacent votre main. Choisissez un jeu pour le regarder.","هذه روبوتات تجريبية تحلّ محل يدك. اختر لعبة لمشاهدتها."),
protoH:L("What Python sends","Ce que Python envoie","ما يرسله بايثون"),
protoP:L(
 ["<p>Every camera frame, Python sends 4 bytes: <code>255, x, y, fingers</code> at 57600 baud.</p><ul class='list'><li><code>x</code> and <code>y</code> are 0 to 100: the palm centre, smoothed so the cursor does not shake. They come from the middle 70% of the image, so you never reach for the edges.</li><li><code>fingers</code> is 0 to 5, or 9 when no hand is visible.</li><li>The value 255 never appears in the data, so the Nano always knows where a packet starts.</li></ul>"],
 ["<p>À chaque image de la caméra, Python envoie 4 octets : <code>255, x, y, doigts</code> à 57600 bauds.</p><ul class='list'><li><code>x</code> et <code>y</code> vont de 0 à 100 : le centre de la paume, lissé pour que le curseur ne tremble pas. Ils viennent des 70 % centraux de l'image, donc inutile de viser les bords.</li><li><code>doigts</code> va de 0 à 5, ou 9 si aucune main n'est visible.</li><li>La valeur 255 n'apparaît jamais dans les données : le Nano sait toujours où commence un paquet.</li></ul>"],
 ["<p>مع كل إطار من الكاميرا يرسل بايثون 4 بايتات: <code>255, x, y, الأصابع</code> بسرعة 57600 باود.</p><ul class='list'><li><code>x</code> و<code>y</code> من 0 إلى 100: مركز الكف بعد تنعيمه كي لا يرتعش المؤشر. تؤخذ من الـ70% الأوسط من الصورة فلا تحتاج لمد يدك نحو الأطراف.</li><li><code>الأصابع</code> من 0 إلى 5، أو 9 إن لم تظهر يد.</li><li>القيمة 255 لا تظهر أبدًا ضمن البيانات، فيعرف النانو دائمًا أين تبدأ الحزمة.</li></ul>"]),
GAMES:[
 {k:"flappy",n:"Flappy Bird",g:L("Close your fist, then open your hand to flap.","Fermez le poing, puis ouvrez la main pour battre des ailes.","اقفل قبضتك ثم افتح يدك ليرفرف الطائر."),
  r:L("Gravity 0.3, flap −3.4, gap 22 px, pipes 12 px wide moving 2 px per frame. One point per pipe. Touching a pipe or the floor ends the run.","Gravité 0,3, battement −3,4, ouverture 22 px, tuyaux de 12 px de large avançant de 2 px par image. Un point par tuyau. Toucher un tuyau ou le sol met fin à la partie.","الجاذبية 0.3 والرفرفة −3.4 والفتحة 22 بكسل والأنابيب بعرض 12 بكسل تتحرك 2 بكسل للإطار. نقطة لكل أنبوب، ولمس أنبوب أو الأرض ينهي اللعب.")},
 {k:"pong",n:"Pong",g:L("Move your hand up and down. The paddle follows your height.","Montez et descendez la main. La raquette suit votre hauteur.","حرّك يدك لأعلى وأسفل. المضرب يتبع ارتفاعها."),
  r:L("3 lives. Each return scores 1 and speeds the ball up 5% (max 4.5 px per frame). When the computer misses you score 5. Its paddle moves 1.6 px per frame, so it can be beaten.","3 vies. Chaque renvoi vaut 1 point et accélère la balle de 5 % (max 4,5 px par image). Quand l'ordinateur rate, vous marquez 5. Sa raquette avance de 1,6 px par image : elle est battable.","3 أرواح. كل صدّ يعطي نقطة ويسرّع الكرة 5% (الحد 4.5 بكسل للإطار). إذا أخطأ الحاسوب تحصل على 5 نقاط. مضربه يتحرك 1.6 بكسل للإطار فيمكن هزمه.")},
 {k:"snake",n:"Snake",g:L("Move your hand away from the centre toward the direction you want.","Éloignez la main du centre vers la direction voulue.","حرّك يدك بعيدًا عن المنتصف نحو الاتجاه الذي تريده."),
  r:L("Dead zone of ±16 out of 100 so small tremors do nothing. 25×9 grid of 5 px cells. Walls wrap around, biting yourself ends the game. Each segment makes it 3 ms faster per step, down to 80 ms.","Zone morte de ±16 sur 100 : les petits tremblements ne comptent pas. Grille de 25×9 cases de 5 px. Les murs se traversent, se mordre met fin à la partie. Chaque segment accélère de 3 ms par pas, jusqu'à 80 ms.","منطقة ميتة ±16 من 100 كي لا تؤثر الرعشات الصغيرة. شبكة 25×9 خلية بحجم 5 بكسل. الجدران تلتف حول الشاشة، وعضّ نفسك ينهي اللعبة. كل جزء جديد يسرّعها 3 مللي ثانية في الخطوة حتى 80.")},
 {k:"shooter",n:"Shooter",g:L("Move your hand left and right. The ship fires by itself.","Déplacez la main à gauche et à droite. Le vaisseau tire tout seul.","حرّك يدك يمينًا ويسارًا. السفينة تطلق النار وحدها."),
  r:L("3 lives, up to 5 enemies and 4 bullets on screen, a shot every 8 frames. Enemy speed is 0.5 + 0.01 × score, capped at 1.6. An enemy that reaches the bottom costs a life.","3 vies, jusqu'à 5 ennemis et 4 tirs à l'écran, un tir toutes les 8 images. Vitesse des ennemis : 0,5 + 0,01 × score, plafonnée à 1,6. Un ennemi qui atteint le bas coûte une vie.","3 أرواح، حتى 5 أعداء و4 رصاصات على الشاشة، ورصاصة كل 8 إطارات. سرعة العدو 0.5 + 0.01 × النتيجة بحد أقصى 1.6. العدو الذي يصل للأسفل يكلّفك روحًا.")}],
menuH:L("Menu and Game Over","Menu et Game Over","القائمة ونهاية اللعبة"),
menuP:L("Show 1 to 4 fingers and hold for 0.8 s to start a game (the row fills as you hold). After Game Over, keep a fist for 0.6 s to retry, or show five fingers to return to the menu. Press m on the laptop keyboard to go back to the menu at any moment.","Montrez 1 à 4 doigts pendant 0,8 s pour lancer un jeu (la ligne se remplit pendant que vous tenez). Après Game Over, gardez le poing 0,6 s pour rejouer, ou montrez cinq doigts pour revenir au menu. Appuyez sur m au clavier pour retourner au menu à tout moment.","أظهر من 1 إلى 4 أصابع وثبّتها 0.8 ثانية لبدء لعبة (يمتلئ الصف أثناء التثبيت). بعد Game Over أبقِ قبضتك 0.6 ثانية لإعادة المحاولة، أو أظهر خمسة أصابع للعودة إلى القائمة. واضغط m على لوحة المفاتيح للعودة للقائمة في أي وقت."),
fingH:L("How fingers are counted","Comment les doigts sont comptés","كيف تُعدّ الأصابع"),
fingP:L("A finger counts as up when its tip is farther from the wrist than its middle joint. The thumb is checked against the base of the little finger. This works even when your hand is tilted. The answer is a vote over the last 5 frames, so one bad frame cannot change it.","Un doigt est levé quand son bout est plus loin du poignet que son articulation médiane. Le pouce est comparé à la base de l'auriculaire. Cela marche même main inclinée. Le résultat est un vote sur les 5 dernières images : une image ratée ne change rien.","يُحسب الإصبع مرفوعًا عندما يكون طرفه أبعد عن المعصم من مفصله الأوسط. ويُفحص الإبهام بالنسبة إلى قاعدة الخنصر. ينجح هذا حتى مع إمالة اليد. والنتيجة تصويت على آخر 5 إطارات فلا يغيّرها إطار خاطئ واحد."),
memH:L("Why the screen is drawn in pages","Pourquoi l'écran est dessiné par pages","لماذا تُرسم الشاشة على صفحات"),
memP:L("The Nano has 2 KB of RAM and a full screen buffer takes 1 KB. The sketch draws the screen in 8 horizontal pages of 128 bytes instead (U8g2 page-buffer mode), and clips every shape by hand because the library cannot take negative coordinates.","Le Nano a 2 Ko de RAM et un tampon d'écran complet en prend 1. Le sketch dessine donc l'écran en 8 pages horizontales de 128 octets (mode page-buffer de U8g2) et découpe chaque forme à la main, car la bibliothèque n'accepte pas les coordonnées négatives.","ذاكرة النانو 2 كيلوبايت، ومخزن الشاشة الكامل يأخذ 1 كيلوبايت. لذلك يرسم الكود الشاشة على 8 صفحات أفقية حجم كل منها 128 بايت (نمط page-buffer في U8g2)، ويقص كل شكل يدويًا لأن المكتبة لا تقبل إحداثيات سالبة."),

roboTitle:L("Robo: a face that listens, thinks and talks","Robo : un visage qui écoute, réfléchit et parle","روبو: وجه يستمع ويفكر ويتحدث"),
roboP:L("Robo blinks, glances around and follows your face through the webcam. Speak and it listens, thinks, then answers aloud while its mouth moves with the loudness of its own voice.","Robo cligne des yeux, regarde autour de lui et suit votre visage grâce à la webcam. Parlez : il écoute, réfléchit, puis répond à voix haute, la bouche synchronisée avec le volume de sa voix.","روبو يرمش وينظر حوله ويتبع وجهك عبر الكاميرا. تكلّم فيستمع ثم يفكر ثم يجيب بصوت عالٍ، وفمه يتحرك مع شدة صوته."),
faceCap:L("Move your cursor over the screen: the eyes follow it, like they follow you through the webcam. Pick a state below, or an emotion in the gallery.","Passez le curseur sur l'écran : les yeux le suivent, comme ils vous suivent par la webcam. Choisissez un état ci-dessous, ou une émotion dans la galerie.","حرّك المؤشر فوق الشاشة: العينان تتبعانه كما تتبعانك عبر الكاميرا. اختر حالة من الأسفل أو عاطفة من المعرض."),
STATES:[L("Idle","Repos","خامل"),L("Listening","Écoute","يستمع"),L("Thinking","Réflexion","يفكر"),L("Speaking","Parole","يتكلم")],
statesH:L("The four states","Les quatre états","الحالات الأربع"),
STATE_TXT:[
 L("Random glances and blinks, now and then a wink or a smile. After 90 s with no voice and no face in front of the webcam it falls asleep.","Regards et clignements aléatoires, de temps en temps un clin d'œil ou un sourire. Après 90 s sans voix ni visage devant la webcam, il s'endort.","نظرات ورمشات عشوائية، وبين حين وآخر غمزة أو ابتسامة. بعد 90 ثانية بلا صوت ولا وجه أمام الكاميرا ينام."),
 L("Wider eyes, raised brows, and sound bars at the sides that move with your voice level.","Yeux plus grands, sourcils levés, et des barres sonores sur les côtés qui suivent le volume de votre voix.","عينان أوسع وحاجبان مرفوعان، وأعمدة صوت على الجانبين تتحرك مع مستوى صوتك."),
 L("Eyes look up and to the side, one eyebrow rises and three dots count in the corner.","Les yeux regardent en haut et de côté, un sourcil se lève et trois points défilent dans le coin.","تنظر العينان للأعلى وللجانب، يرتفع حاجب واحد وتظهر ثلاث نقاط تتتابع في الزاوية."),
 L("The mouth opens in step with the loudness of the voice, measured 20 times a second on the laptop.","La bouche s'ouvre au rythme du volume de la voix, mesuré 20 fois par seconde sur le portable.","يفتح الفم بتناغم مع شدة الصوت، وتُقاس 20 مرة في الثانية على اللابتوب.")],
emoH:L("Nine emotions","Neuf émotions","تسع عواطف"),
EMOS:[L("Neutral","Neutre","محايد"),L("Happy","Content","سعيد"),L("Sad","Triste","حزين"),L("Angry","En colère","غاضب"),L("Surprised","Surpris","متفاجئ"),L("Love","Amoureux","حب"),L("Sleepy","Endormi","نعسان"),L("Wink","Clin d'œil","غمزة"),L("Laugh","Rire","ضحك")],
pipeH:L("From your voice to its answer","De votre voix à sa réponse","من صوتك إلى جوابه"),
ROBO_STEPS:[
 L("The microphone is watched by a loudness detector. About 0.3 s before you start and up to 1 s of silence after you stop are kept, and silence ends your turn.","Un détecteur de volume surveille le micro. On garde environ 0,3 s avant que vous parliez, et 1 s de silence après vous met fin à votre tour.","جهاز كشف مستوى الصوت يراقب الميكروفون. يُحتفظ بنحو 0.3 ثانية قبل بدء كلامك، وثانية صمت بعد توقفك تنهي دورك."),
 L("The recording goes to the AI engine you chose (see the table below).","L'enregistrement part vers le moteur d'IA choisi (voir le tableau plus bas).","يذهب التسجيل إلى محرك الذكاء الاصطناعي الذي اخترته (انظر الجدول أدناه)."),
 L("The answer comes back as text with an emotion tag, for example <code>[happy]</code>.","La réponse revient en texte avec une étiquette d'émotion, par exemple <code>[happy]</code>.","يعود الجواب نصًا مع وسم عاطفة، مثل <code>[happy]</code>."),
 L("The face switches to that emotion, then the voice is generated and played.","Le visage prend cette émotion, puis la voix est générée et jouée.","يتحول الوجه إلى تلك العاطفة، ثم يُولَّد الصوت ويُشغَّل."),
 L("While it plays, Python streams the voice loudness to the Nano so the mouth moves in time.","Pendant la lecture, Python envoie le volume de la voix au Nano pour synchroniser la bouche.","أثناء التشغيل يرسل بايثون شدة الصوت إلى النانو ليتحرك الفم بتزامن معه.")],
camP:L("In parallel, the webcam finds your face (an OpenCV Haar cascade on a 320×240 image) and sends its position so the eyes look at you. When you appear after 8 s away, Robo greets you.","En parallèle, la webcam repère votre visage (cascade de Haar OpenCV sur une image de 320×240) et envoie sa position pour que les yeux vous regardent. Quand vous réapparaissez après 8 s d'absence, Robo vous salue.","بالتوازي تكتشف الكاميرا وجهك (مصنّف Haar في OpenCV على صورة 320×240) وترسل موضعه لتنظر العينان إليك. وإذا ظهرت بعد غياب 8 ثوانٍ يرحّب بك روبو."),
serialH:L("What Python sends to the face","Ce que Python envoie au visage","ما يرسله بايثون إلى الوجه"),

tokH:L("Saving tokens (Gemini Lite)","Économiser les jetons (Gemini Lite)","توفير التوكنز (Gemini Lite)"),
TOK:[
 L("Audio costs 32 tokens per second of recording, so silence is trimmed and noise or clips under 0.4 s are never sent.","L'audio coûte 32 jetons par seconde d'enregistrement : le silence est coupé, et le bruit ou les clips de moins de 0,4 s ne sont jamais envoyés.","الصوت يكلّف 32 توكنًا لكل ثانية تسجيل، لذلك يُقص الصمت ولا يُرسل الضجيج أو المقاطع الأقصر من 0.4 ثانية."),
 L("The voice comes from edge-tts, so speech never uses Gemini tokens. One request per turn instead of two.","La voix vient d'edge-tts : la parole ne consomme aucun jeton Gemini. Une requête par tour au lieu de deux.","الصوت يأتي من edge-tts فلا يستهلك توكنز Gemini. وطلب واحد لكل دور بدل طلبين."),
 L("Thinking is set to the minimum and replies are capped at 160 tokens, in plain text instead of JSON.","La réflexion est réglée au minimum et les réponses plafonnées à 160 jetons, en texte simple plutôt qu'en JSON.","التفكير مضبوط على الحد الأدنى والردود محدودة بـ160 توكنًا، بنص بسيط بدل JSON."),
 L("Short system prompt, 3 turns of memory, each trimmed. Set <code>HISTORY_TURNS = 0</code> for the cheapest mode.","Prompt système court, 3 tours de mémoire, chacun raccourci. Mettez <code>HISTORY_TURNS = 0</code> pour le mode le moins cher.","تعليمات نظام قصيرة وذاكرة 3 أدوار، كل منها مقصوص. اجعل <code>HISTORY_TURNS = 0</code> لأرخص وضع."),
 L("A live meter prints the tokens of every request. At the budget limit Robo falls asleep and stops calling the API; the battery on its screen shows what is left.","Un compteur affiche les jetons de chaque requête. À la limite du budget, Robo s'endort et cesse d'appeler l'API ; la batterie sur l'écran montre ce qui reste.","عدّاد مباشر يطبع توكنز كل طلب. وعند بلوغ الميزانية ينام روبو ويتوقف عن استدعاء الـAPI، وتُظهر البطارية على شاشته ما تبقى.")],
verH:L("Three generations of the face","Trois générations du visage","ثلاثة أجيال للوجه"),
VER:[
 L("<b>v1</b> Eyes that blink and glance, a mouth, eight emotions, four states.","<b>v1</b> Des yeux qui clignent et regardent, une bouche, huit émotions, quatre états.","<b>v1</b> عينان ترمشان وتنظران، وفم، وثماني عواطف وأربع حالات."),

setupTitle:L("Set it up","Mise en route","ابدأ التشغيل"),
setupP:L("Install the Arduino IDE and the U8g2 library (Tools, Manage Libraries), and Python with pip. Then follow the tab of the project you want.","Installez l'Arduino IDE et la bibliothèque U8g2 (Outils, Gérer les bibliothèques), ainsi que Python avec pip. Suivez ensuite l'onglet du projet voulu.","ثبّت Arduino IDE ومكتبة U8g2 (من Tools ثم Manage Libraries) وبايثون مع pip. ثم اتبع تبويب المشروع الذي تريده."),

   {t:L("Install the Python libraries.","Installez les bibliothèques Python.","ثبّت مكتبات بايثون."),c:[[null,"pip install opencv-python mediapipe pyserial"]]},

FAQ:[
 L(["The screen stays black","L'écran reste noir","الشاشة سوداء"],["The usual cause is unsoldered header pins: pins that only rest in the breadboard leave an air gap. Solder them, check the seven wires against the table, and try the SH1106 line in the sketch. The yellow and blue split is normal.","La cause habituelle : des broches non soudées, qui laissent un jeu d'air dans la breadboard. Soudez-les, vérifiez les sept fils avec le tableau, et essayez la ligne SH1106 du sketch. La séparation jaune et bleu est normale.","السبب المعتاد دبابيس غير ملحومة: الدبابيس التي تستند فقط إلى لوحة التجارب تترك فجوة هوائية. الحمها وراجع الأسلاك السبعة مع الجدول وجرّب سطر SH1106 في الكود. وانقسام الأصفر والأزرق أمر طبيعي."],[""]),

 L(["The gesture is detected but nothing moves","Le geste est détecté mais rien ne bouge","الإيماءة تُكتشف لكن لا شيء يتحرك"],["Check that the sketch and the Python file belong to the same project: the three use different messages. For Dino, the game may simply be over; the current sketch restarts on a raised hand.","Vérifiez que le sketch et le fichier Python appartiennent au même projet : les trois utilisent des messages différents. Pour Dino, la partie est peut-être finie ; le sketch actuel redémarre quand vous levez la main.","تأكد أن الكود والملف البايثون من نفس المشروع: فالثلاثة تستخدم رسائل مختلفة. وفي الداينو قد تكون اللعبة انتهت، والكود الحالي يعيد التشغيل برفع اليد."],[""]),

 L(["Robo does not hear me, or hears noise","Robo ne m'entend pas, ou entend du bruit","روبو لا يسمعني أو يلتقط ضجيجًا"],["Set <code>MIC_THRESHOLD</code> by hand: 800 if it triggers too often, 300 if it never triggers. Also check that Windows uses the right default microphone and that Python is allowed to use it.","Réglez <code>MIC_THRESHOLD</code> à la main : 800 s'il se déclenche trop, 300 s'il ne se déclenche jamais. Vérifiez aussi que Windows utilise le bon micro par défaut et que Python y a accès.","اضبط <code>MIC_THRESHOLD</code> يدويًا: 800 إن كان يلتقط كثيرًا و300 إن كان لا يلتقط أبدًا. وتأكد أن ويندوز يستعمل الميكروفون الصحيح وأن بايثون مسموح له باستخدامه."],[""]),

/* ===================== PIXEL ENGINE (128×64 two-colour OLED) ===================== */
const GW=128,GH=64,SPLIT=16,YEL="#ffd21f",BLU="#4cb8ff";
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const GRID=(()=>{const c=document.createElement("canvas");c.width=512;c.height=256;const g=c.getContext("2d");g.fillStyle="rgba(0,0,0,.62)";for(let x=4;x<=512;x+=4)g.fillRect(x-1,0,1,256);for(let y=4;y<=256;y+=4)g.fillRect(0,y-1,512,1);return c;})();
let G=null; /* current drawing context (128×64) */

function R(x,y,w,h,k){
  x=Math.round(x);y=Math.round(y);w=Math.round(w);h=Math.round(h);
  if(w<=0||h<=0||y+h<=0||y>=GH||x+w<=0||x>=GW)return;
  if(k){G.fillStyle="#000";G.fillRect(x,y,w,h);return;}
  if(y<SPLIT){const h1=Math.min(h,SPLIT-y);G.fillStyle=YEL;G.fillRect(x,y,w,h1);if(h>h1){G.fillStyle=BLU;G.fillRect(x,SPLIT,w,h-h1);}}
  else{G.fillStyle=BLU;G.fillRect(x,y,w,h);}
}
function RB(x,y,w,h,r,k){
  r=Math.max(0,Math.min(r,(h-1)>>1,(w-1)>>1));
  for(let i=0;i<h;i++){
    let dy=i<r?r-i-.5:(i>=h-r?i-(h-r)+.5:0),ins=0;
    if(dy>0)ins=Math.ceil(r-Math.sqrt(Math.max(0,r*r-dy*dy)));
    R(x+ins,y+i,w-2*ins,1,k);
  }
}
function DISC(cx,cy,r,k){for(let dy=-r;dy<=r;dy++){const dx=Math.floor(Math.sqrt(r*r-dy*dy+.25));R(cx-dx,cy+dy,dx*2+1,1,k);}}
function TRI(x0,y0,x1,y1,x2,y2,k){
  const miny=Math.min(y0,y1,y2),maxy=Math.max(y0,y1,y2),E=[[x0,y0,x1,y1],[x1,y1,x2,y2],[x2,y2,x0,y0]];
  for(let y=miny;y<=maxy;y++){
    let a=1e9,b=-1e9;
    for(const [xa,ya,xb,yb] of E){
      if((ya<=y&&yb>=y)||(yb<=y&&ya>=y)){
        if(ya===yb){a=Math.min(a,xa,xb);b=Math.max(b,xa,xb);}
        else{const x=xa+(xb-xa)*(y-ya)/(yb-ya);a=Math.min(a,x);b=Math.max(b,x);}
      }
    }
    if(b>=a)R(Math.round(a),y,Math.round(b)-Math.round(a)+1,1,k);
  }
}
function CURVE(cx,cy,hw,curv,th){hw=Math.max(1,hw);for(let dx=-hw;dx<=hw;dx++){const y=cy+Math.trunc(curv*(hw*hw-dx*dx)/(hw*hw));R(cx+dx,y,1,th);}}
function TLINE(x0,y0,x1,y1){const dx=x1-x0;if(dx===0){R(x0,Math.min(y0,y1),2,Math.abs(y1-y0)+2);return;}const s=dx>0?1:-1;for(let x=x0;x!==x1+s;x+=s){R(x,y0+Math.trunc((y1-y0)*(x-x0)/dx),1,2);}}
function HEART(cx,cy,r){DISC(cx-r,cy-(r>>1),r);DISC(cx+r,cy-(r>>1),r);TRI(cx-2*r+1,cy-(r>>1)+2,cx+2*r-1,cy-(r>>1)+2,cx,cy+2*r);}
function RING(cx,cy,r){DISC(cx,cy,r);DISC(cx,cy,r-2,true);}
function SPR(rows,x,y){for(let r=0;r<rows.length;r++){const row=rows[r];let c=0;while(c<row.length){if(row[c]==="1"){let e=c;while(e<row.length&&row[e]==="1")e++;R(x+c,y+r,e-c,1);c=e;}else c++;}}}

/* 3×5 pixel font */
const FD={"0":"111101101101111","1":"010110010010111","2":"110001010100111","3":"110001010001110","4":"101101111001001","5":"111100110001110","6":"011100111101111","7":"111001010010010","8":"111101111101111","9":"111101111001110",
A:"010101111101101",B:"110101110101110",C:"011100100100011",D:"110101101101110",E:"111100110100111",F:"111100110100100",G:"011100101101011",H:"101101111101101",I:"111010010010111",J:"001001001101010",K:"101101110101101",L:"100100100100111",M:"101111111101101",N:"110101101101101",O:"010101101101010",P:"110101110100100",Q:"010101101111011",R:"110101110101101",S:"011100010001110",T:"111010010010010",U:"101101101101111",V:"101101101101010",W:"101101111111101",X:"101101010101101",Y:"101101010010010",Z:"111001010100111",":":"000010000010000","-":"000000111000000","!":"010010010000010"};
function TXT(s,x,y){s=String(s).toUpperCase();for(const ch of s){const g=FD[ch];if(g){for(let i=0;i<15;i++)if(g[i]==="1")R(x+(i%3),y+((i/3)|0),1,1);}x+=4;}return x;}
const TW=s=>String(s).length*4-1;
const pad=(n,l)=>String(Math.floor(n)).padStart(l,"0");
function overlay(a,b){R(14,20,100,30,true);R(14,20,100,1);R(14,49,100,1);R(14,20,1,30);R(113,20,1,30);TXT(a,64-TW(a)/2,28);if(b)TXT(b,64-TW(b)/2,38);}

class Screen{
  constructor(cv){this.cv=cv;cv.width=512;cv.height=256;this.ctx=cv.getContext("2d");this.lo=document.createElement("canvas");this.lo.width=GW;this.lo.height=GH;this.g=this.lo.getContext("2d");}
  clear(){this.g.fillStyle="#000";this.g.fillRect(0,0,GW,GH);}
  present(){const c=this.ctx;c.imageSmoothingEnabled=false;c.drawImage(this.lo,0,0,512,256);c.drawImage(GRID,0,0);}
}

/* ===================== DEMOS (ported from the Arduino sketches) ===================== */
const DINO_BODY=["0000011111111000","0000011011111110","0000011111111100","0000011111111100","0000011111000000","1000111111001000","1101111111011000","1111111111000000","0111111111000000","0011111111000000","0001111111000000","0000111110000000"];
const LEGS_A=["0000110001100000","0000110001000000","0000110000000000","0000111000000000"];
const LEGS_B=["0000110001100000","0000100001100000","0000000001100000","0000000001110000"];
const GROUND=58;

function cactus(x,w,h){
  const top=GROUND-h,cx=x+(w>>1)-1,ay=top+(h>>1);
  R(cx,top,3,h);R(x,ay,cx-x+1,2);R(x,ay-4,2,6);R(cx+2,ay-2,x+w-cx-2,2);R(x+w-2,ay-5,2,5);
}

function makeDino(opt){
  let hi=0,s,auto=opt&&opt.auto!==undefined?opt.auto:true,humanJump=false;
  const mk=x=>{const t=rand(0,2);return{x,t,w:t===0?7:t===1?9:15,h:t===1?16:12};};
  function reset(){s={y:42,vy:0,air:false,speed:3,score:0,dead:false,t:0,f:0,obs:[mk(170),mk(280)]};}
  reset();
  const hit=()=>{const dx1=15,dx2=26,dy1=s.y+2,dy2=s.y+15;for(const o of s.obs){const ox1=o.x+1,ox2=o.x+o.w-1,oy1=GROUND-o.h+1,oy2=GROUND;if(dx1<ox2&&dx2>ox1&&dy1<oy2&&dy2>oy1)return true;}return false;};
  return{
    setAuto(a){auto=a;},
    jump(){humanJump=true;},
    step(){
      s.f++;
      if(s.dead){s.t++;if(s.t>45)reset();return;}
      let want=humanJump;humanJump=false;
      if(auto&&!s.air){for(const o of s.obs){const gap=o.x-28;if(gap>-4&&gap<=3*s.speed+8){want=true;break;}}}
      if(want&&!s.air){s.vy=-7;s.air=true;}
      if(s.air){s.y+=s.vy;s.vy+=.8;if(s.y>=42){s.y=42;s.vy=0;s.air=false;}}
      s.speed=Math.min(5.5,3+s.score/200);
      for(const o of s.obs){o.x-=s.speed;if(o.x+o.w<0){const far=Math.max(s.obs[0].x,s.obs[1].x),n=mk(Math.max(128,far+90+s.speed*8)+rand(0,50));o.x=n.x;o.t=n.t;o.w=n.w;o.h=n.h;}}
      s.score+=.25;
      if(hit()){s.dead=true;s.t=0;hi=Math.max(hi,Math.floor(s.score));}
    },
    draw(){
      const sc="HI "+pad(hi,5)+" "+pad(s.score,5);TXT(sc,126-TW(sc),4);
      R(0,GROUND,128,1);for(let i=0;i<8;i++){const gx=((i*23+18400-Math.floor(s.f*s.speed))%184)-20;R(gx,GROUND+2+(i%2)*2,2+(i%3),1);}
      for(let i=0;i<2;i++){const cx=((i*70+200-Math.floor(s.f*.6))%190)-30;RB(cx,24+i*8,14,4,1);RB(cx+3,22+i*8,8,3,1);}
      for(const o of s.obs){if(o.x<128){const x=Math.round(o.x);if(o.t===2){cactus(x,7,o.h);cactus(x+8,7,o.h);}else cactus(x,o.w,o.h);}}
      const y=Math.round(s.y);SPR(DINO_BODY,12,y);SPR((!s.air&&((s.f>>2)&1))?LEGS_B:LEGS_A,12,y+12);
      if(s.dead)overlay("GAME OVER","RAISE HAND");
    }
  };
}

function makeFlappy(){
  const BX=28,PW=12,GAPH=22,FLOOR=62;let s;
  const gp=()=>rand(24,36);
  function reset(){s={y:36,vy:0,score:0,dead:false,t:0,p:[{x:140,g:gp(),pa:false},{x:206,g:gp(),pa:false}]};}
  reset();
  return{
    step(){
      if(s.dead){s.t++;if(s.t>45)reset();return;}
      let tg=36;for(const p of s.p){if(p.x+PW>BX-2){tg=p.g+GAPH/2+2;break;}}
      if(s.y+3>tg&&s.vy>-.5)s.vy=-3.4;
      s.vy+=.3;s.y+=s.vy;if(s.y<16){s.y=16;s.vy=0;}
      for(const p of s.p){
        p.x-=2;if(p.x<-PW-2){p.x+=132;p.g=gp();p.pa=false;}
        if(!p.pa&&p.x+PW<BX){p.pa=true;s.score++;}
        if(BX+8>p.x&&BX<p.x+PW&&(s.y<p.g||s.y+6>p.g+GAPH))s.dead=true;
      }
      if(s.y+6>=FLOOR)s.dead=true;
      if(s.dead)s.t=0;
    },
    draw(){
      TXT("FLAPPY",0,4);const sc=String(s.score);TXT(sc,126-TW(sc),4);
      R(0,FLOOR,128,1);
      for(const p of s.p){const x=Math.round(p.x),g=p.g;R(x,16,PW,g-20);R(x-1,g-4,PW+2,4);R(x-1,g+GAPH,PW+2,4);R(x,g+GAPH+4,PW,FLOOR-(g+GAPH+4));}
      const y=Math.round(s.y);R(BX+1,y,6,6);R(BX,y+1,8,4);R(BX+8,y+3,2,2);R(BX+5,y+1,1,1,true);
      if(s.dead)overlay("GAME OVER","CLOSE THEN OPEN");
    }
  };
}

function makePong(){
  const PH=14;let s;
  function serve(d){s.bx=64;s.by=40;s.bvx=2*d;s.bvy=rand(-12,12)/10;}
  function reset(){s={bx:64,by:40,bvx:-2,bvy:1,py:30,ai:30,score:0,lives:3,dead:false,t:0};serve(-1);}
  reset();
  return{
    step(){
      if(s.dead){s.t++;if(s.t>45)reset();return;}
      s.bx+=s.bvx;s.by+=s.bvy;
      if(s.by<17){s.by=17;s.bvy=-s.bvy;}if(s.by>59){s.by=59;s.bvy=-s.bvy;}
      /* the "hand": follows the ball with a limited speed */
      const tg=s.by+1.5-PH/2;s.py+=clamp(tg-s.py,-2.6,2.6);s.py=clamp(s.py,16,62-PH);
      if(s.bvx<0&&s.bx<=7&&s.bx>=2&&s.by+3>s.py&&s.by<s.py+PH){s.bvx=Math.min(4.5,-s.bvx*1.05);s.bvy=((s.by+1.5)-(s.py+PH/2))/(PH/2)*2.2;s.score++;}
      const t2=s.by+1.5-PH/2;if(s.ai<t2-1)s.ai+=1.6;else if(s.ai>t2+1)s.ai-=1.6;s.ai=clamp(s.ai,16,62-PH);
      if(s.bvx>0&&s.bx>=118&&s.bx<=124&&s.by+3>s.ai&&s.by<s.ai+PH){s.bvx=-s.bvx;s.bvy=((s.by+1.5)-(s.ai+PH/2))/(PH/2)*2.2;}
      if(s.bx<0){s.lives--;if(s.lives<=0){s.dead=true;s.t=0;return;}serve(1);}
      if(s.bx>128){s.score+=5;serve(-1);}
    },
    draw(){
      TXT("PONG L:"+s.lives,0,4);const sc=String(s.score);TXT(sc,126-TW(sc),4);
      for(let y=16;y<62;y+=6)R(63,y,2,3);

function makeSnake(){
  const SC=25,SR=9,C=5;let s;
  function food(){while(true){const p=[rand(0,SC-1),rand(0,SR-1)];if(!s.b.some(q=>q[0]===p[0]&&q[1]===p[1])){s.f=p;return;}}}
  function reset(){s={b:[[12,4],[11,4],[10,4]],d:0,f:null,score:0,dead:false,t:0,c:0};food();}
  reset();
  const DX=[1,0,-1,0],DY=[0,1,0,-1];
  const wrap=(x,y)=>[(x+SC)%SC,(y+SR)%SR];
  return{
    step(){
      if(s.dead){s.t++;if(s.t>45)reset();return;}
      s.c++;const need=Math.max(3,Math.round((170-3*s.b.length)/30));if(s.c<need)return;s.c=0;
      let best=null,bd=1e9;
      for(let d=0;d<4;d++){if(d===(s.d+2)%4)continue;const [nx,ny]=wrap(s.b[0][0]+DX[d],s.b[0][1]+DY[d]);
        if(s.b.slice(0,-1).some(q=>q[0]===nx&&q[1]===ny))continue;
        const dist=Math.abs(nx-s.f[0])+Math.abs(ny-s.f[1]);if(dist<bd){bd=dist;best=d;}}
      if(best===null){s.dead=true;s.t=0;return;}
      s.d=best;const [nx,ny]=wrap(s.b[0][0]+DX[s.d],s.b[0][1]+DY[s.d]);
      const grow=nx===s.f[0]&&ny===s.f[1];s.b.unshift([nx,ny]);if(!grow)s.b.pop();else{s.score++;food();}
    },
    draw(){
      TXT("SNAKE",0,4);const sc=String(s.score);TXT(sc,126-TW(sc),4);
      s.b.forEach((q,i)=>{if(i===0)R(1+q[0]*C,17+q[1]*C,5,5);else R(1+q[0]*C,17+q[1]*C,4,4);});
      R(1+s.f[0]*C,17+s.f[1]*C,4,4);R(2+s.f[0]*C,18+s.f[1]*C,2,2,true);
      if(s.dead)overlay("GAME OVER");
    }
  };
}

function makeShooter(){
  let s,fr=0;
  function reset(){s={x:60,lives:3,score:0,e:[],b:[],next:20,dead:false,t:0};}
  reset();
  return{
    step(){
      fr++;if(s.dead){s.t++;if(s.t>45)reset();return;}
      let tgt=s.x+4;let low=null;for(const e of s.e){if(!low||e.y>low.y)low=e;}if(low)tgt=low.x+4;
      const d=tgt-(s.x+4);s.x=clamp(s.x+clamp(d,-3,3),0,119);
      if(fr%8===0&&s.b.length<4)s.b.push({x:s.x+4,y:54});
      s.b.forEach(b=>b.y-=4);s.b=s.b.filter(b=>b.y>=16);
      if(fr>=s.next){if(s.e.length<5)s.e.push({x:rand(0,119),y:17});s.next=fr+Math.max(12,40-Math.floor(s.score/3));}
      const spd=Math.min(1.6,.5+s.score*.01);
      for(const e of s.e){e.y+=spd;for(const b of s.b){if(b.x>=e.x-1&&b.x<=e.x+8&&b.y>=e.y&&b.y<=e.y+6){e.dead=true;b.dead=true;s.score++;break;}}
        if(!e.dead&&e.y+6>=56){e.dead=true;s.lives--;if(s.lives<=0){s.dead=true;s.t=0;}}}
      s.e=s.e.filter(e=>!e.dead);s.b=s.b.filter(b=>!b.dead);
    },
    draw(){
      TXT("SHOOTER L:"+s.lives,0,4);const sc=String(s.score);TXT(sc,126-TW(sc),4);
      R(s.x+3,56,3,3);R(s.x+1,58,7,2);R(s.x,60,9,2);
      for(const b of s.b)R(b.x,b.y,1,3);
      for(const e of s.e){const x=Math.round(e.x),y=Math.round(e.y);R(x+1,y,6,3);R(x,y+2,8,2);R(x+1,y+4,2,2);R(x+5,y+4,2,2);R(x+2,y+1,1,1,true);R(x+5,y+1,1,1,true);}
      if(s.dead)overlay("GAME OVER");
    }
  };
}

const ROBO={st:0,emo:0,gz:null,gzAt:0};
function makeFace(opt){
  const fixed=opt&&opt.fixed;
  let tick=0,lookX=0,lookY=0,tx=0,ty=0,openC=0,ew=28,chL=0,chR=0,slant=0,lid=0,bY=0,bT=0,mC=2,mH=8,think=0,mo=0,blinkF=-1,nextBlink=70,nextSac=0,bob=0,shake=0,eyeH=0,st=0,emo=0,sec=0;
  const lerp=(a,b,k)=>a+(b-a)*k;
  return{
    step(){
      tick++;sec=performance.now()/1000;
      const c=fixed!==undefined?{st:0,emo:fixed,gz:null}:ROBO;st=c.st;emo=c.emo;
      if(emo===6){tx=0;ty=3;}
      else if(st===2){tx=((tick/30|0)%2)?7:-3;ty=-5;}
      else if(c.gz&&performance.now()-ROBO.gzAt<2500){tx=(c.gz[0]-50)*8/50;ty=(c.gz[1]-50)*5/50;}
      else if(st===1){tx=0;ty=0;}

      lookX=lerp(lookX,tx,.35);lookY=lerp(lookY,ty,.35);
      let bf=1;
      if(blinkF<0&&tick>nextBlink){blinkF=0;nextBlink=tick+rand(70,180);if(rand(0,4)===0)nextBlink=tick+12;}
      if(blinkF>=0){blinkF++;bf=Math.abs(blinkF-3)/3;if(blinkF>=6){blinkF=-1;bf=1;}}
      let tEw=28,tEh=1,tCl=0,tCr=0,tSl=0,tLid=0,tBY=0,tBT=0,tMC=2,tMH=8;
      switch(emo){
        case 1:tCl=tCr=.62;tBY=-1;tMC=7;tMH=14;break;
        case 2:tEh=.95;tSl=-1;tBY=1;tBT=-3;tMC=-5;tMH=9;break;
        case 3:tEh=.85;tSl=1;tLid=.08;tBY=2;tBT=4;tMC=-3;tMH=10;break;
        case 4:tEh=1.2;tEw=22;tBY=-3;break;
        case 5:tBY=-1;tMC=7;tMH=14;break;
        case 6:tEh=.5+.05*Math.sin(sec*1.4);tLid=.35;tBY=2;tMC=0;tMH=5;break;
        case 7:tCr=.9;tCl=.05;tMC=7;tMH=12;tBY=-1;break;
        case 8:tCl=tCr=.7;tBY=-2;tMC=8;tMH=15;break;
      }
      if(st===1){if(tEh<1.12)tEh=1.12;tBY=-3;}

      bY=lerp(bY,tBY,.25);bT=lerp(bT,tBT,.25);mC=lerp(mC,tMC,.25);mH=lerp(mH,tMH,.25);think=lerp(think,st===2?3:0,.25);
      eyeH=Math.max(0,Math.floor(26*openC*bf));
      let to=0;
      if(st===3)to=clamp(.5+.5*Math.sin(sec*14)*Math.cos(sec*5.3)+rand(-10,10)/60,0,1);
      else if(emo===8)to=.55+.45*Math.sin(sec*16);
      mo=lerp(mo,to,.6);
      bob=st===3?Math.floor(mo*2):(emo===8?Math.round(Math.sin(sec*22)*1.5):0);
      shake=emo===3?rand(-1,1):0;
    },
    draw(){
      const brow=(side,cx)=>{
        let by=6+Math.trunc(bY)+Math.trunc(lookY*.4)+bob;if(side===1)by-=Math.trunc(think);
        const tl=Math.trunc(bT),ox=side===0?cx-10:cx+10,ix=side===0?cx+10:cx-10;
        TLINE(ox,by-Math.trunc(tl/2),ix,by+(tl-Math.trunc(tl/2)));
      };
      const eye=side=>{
        const cx=(side?94:34)+Math.trunc(lookX)+shake,cy=26+Math.trunc(lookY)+bob;
        brow(side,cx);
        if(emo===5){HEART(cx,cy-2,5+((sec*4|0)%2));return;}
        const w=Math.round(ew),h=eyeH;
        if(h<4){R(cx-(w>>1),cy-1,w,3);return;}
        RB(cx-(w>>1),cy-(h>>1),w,h,7);
        const x0=cx-(w>>1)-1,x1=cx+(w>>1)+1,y0=cy-(h>>1)-1;
        if(Math.abs(slant)>.05&&h>10){

          if(cr)TRI(x1,y0,x1,yd,x0,y0,true);else TRI(x0,y0,x0,yd,x1,y0,true);
        }

        const ch=side?chR:chL;

      if(chL+chR>.6||emo===5){for(let i=0;i<3;i++){const lx=8+i*4,rx=106+i*4;R(lx,45,1,1);R(lx+1,44,1,1);R(lx+2,43,1,1);R(rx,45,1,1);R(rx+1,44,1,1);R(rx+2,43,1,1);}}

      if(emo===4)TXT("!",120,4);
      if(emo===6){const z=(sec*1.66|0)%4;if(z>0)TXT("Z",98,12);if(z>1)TXT("Z",106,8);if(z>2)TXT("Z",114,4);}
    }
  };
}

  $("#engTbl").innerHTML=`<thead><tr>${eh.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>`+T.ENG.map(r=>`<tr><td>${r[0][li]}</td>${r[1].map(c=>`<td>${cell(c)}</td>`).join("")}</tr>`).join("")+"</tbody>";
  $("#tokList").innerHTML=T.TOK.map(x=>`<li>${x[li]}</li>`).join("");
  $("#verList").innerHTML=T.VER.map(x=>`<li>${x[li]}</li>`).join("");
  $("#roboFiles").innerHTML=files(["smart_face_v3.ino","voice_face_ai.py","voice_face_gemini_lite.py","local_voice_face.py"]);
}
function buildGallery(){
  const gal=$("#gal");gal.innerHTML="";
  for(let i=0;i<9;i++){
    const b=document.createElement("button");b.type="button";b.className="gcell";b.setAttribute("aria-pressed",String(i===ROBO.emo));
    b.innerHTML='<canvas></canvas><span></span>';gal.appendChild(b);
    const v=new DemoView(b.querySelector("canvas"),"face",{fixed:i,slow:true});registerView(v,b.querySelector("canvas"));
    b.onclick=()=>{ROBO.emo=i;$$("#gal .gcell").forEach((x,j)=>x.setAttribute("aria-pressed",String(j===i)));};
  }
}
async function copyText(txt,btn){
  let ok=false;
  try{await navigator.clipboard.writeText(txt);ok=true;}
  catch(e){try{const ta=document.createElement("textarea");ta.value=txt;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();ok=document.execCommand("copy");ta.remove();}catch(e2){}}
  btn.textContent=ok?t("copied"):t("copy");btn.classList.toggle("done",ok);
  setTimeout(()=>{btn.textContent=t("copy");btn.classList.remove("done");},1400);
}
let setupTab=0;
function renderSetup(){
  const tabs=$("#setupTabs");tabs.innerHTML="";
  T.TABS.forEach((n,i)=>{const b=document.createElement("button");b.type="button";b.className="tab";b.textContent=n[li];b.setAttribute("role","tab");b.setAttribute("aria-selected",String(i===setupTab));b.onclick=()=>{setupTab=i;renderSetup();};tabs.appendChild(b);});
  $("#setupBody").innerHTML='<ol class="steps setup-steps">'+T.SETUP[setupTab].map(s=>{
    let c="";(s.c||[]).forEach(([lbl,code])=>{c+=`<div class="codewrap">${lbl?`<span class="lbl">${lbl[li]}</span>`:""}<pre class="code">${esc(code)}</pre><button type="button" class="copy">${t("copy")}</button></div>`;});
    return `<li>${s.t[li]}${c}</li>`;}).join("")+"</ol>";
  $$("#setupBody .copy").forEach(b=>b.onclick=()=>copyText(b.previousElementSibling.textContent,b));
}
function renderFaq(){
  $("#faqBody").innerHTML=T.FAQ.map(f=>`<details><summary>${f[0][li]}</summary><p>${f[1][li]}</p></details>`).join("");
}
function renderAll(){
  renderStatic();renderChips();renderHow();renderWiring();renderDino();renderGames();renderRobo();renderSetup();renderFaq();
}

/* ---------- views (live OLED simulations) ---------- */
const views=[];const viewByEl=new Map();
let visIO=null;
function registerView(v,el){
  views.push(v);viewByEl.set(el,v);
  if(visIO)visIO.observe(el);else v.active=true;
}
let viewDino,viewGame,viewFace,sceneView;
function setSceneKind(k){if(!sceneView)return;sceneView.setKind(k);updateChips();}
function kindFor(id){
  if(id==="dino"||id==="wiring")return "dino";
  if(id==="games")return gameKind;
  if(id==="robo"||id==="setup"||id==="faq")return "face";
  return null; /* hero and how: cycle */
}

/* ---------- 3D scene ---------- */
const POSES={
  hero:{x:3.1,y:-.1,rx:.16,ry:-.45,s:1},how:{x:3.1,y:0,rx:.55,ry:-.2,s:.95},wiring:{x:3.1,y:-.1,rx:.38,ry:.12,s:1},
  dino:{x:3.1,y:.1,rx:.04,ry:-.28,s:1.1},games:{x:3.1,y:.1,rx:.06,ry:.26,s:1.1},robo:{x:3.1,y:.05,rx:0,ry:-.14,s:1.15},
  setup:{x:3.2,y:-.2,rx:.3,ry:.4,s:.85},faq:{x:3.2,y:-.2,rx:.3,ry:.4,s:.85}};
function isDark(){const a=document.documentElement.getAttribute("data-theme");return a==="dark"||(a!=="light"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);}

function initScene(canvasForTexture){
  if(!window.THREE)return null;
  const cv=$("#scene");let renderer;
  try{renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true,powerPreference:"low-power"});}catch(e){cv.style.display="none";return null;}
  renderer.setClearColor(0x000000,0);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(32,1,.1,100),rig=new THREE.Group();scene.add(rig);
  const M=(c,r,m,e)=>new THREE.MeshStandardMaterial({color:c,roughness:r===undefined?.6:r,metalness:m||0,emissive:e||0x000000});
  const bx=(w,h,d,mat,x,y,z,par)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);(par||rig).add(m);return m;};
  scene.add(new THREE.AmbientLight(0xffffff,.8));
  const key=new THREE.DirectionalLight(0xffffff,.9);key.position.set(4,6,8);scene.add(key);
  const rim=new THREE.PointLight(0x4cb8ff,.9,40);rim.position.set(-7,2,5);scene.add(rim);
  const warm=new THREE.PointLight(0xffd21f,.6,40);warm.position.set(7,-1,6);scene.add(warm);

  /* Arduino Nano */
  const nano=new THREE.Group();nano.position.set(0,-1.75,.5);rig.add(nano);
  bx(5.4,.14,2.1,M(0x1560a8,.5,.2),0,0,0,nano);
  bx(1.0,.1,1.0,M(0x0b0d12,.4,.3),.7,.12,0,nano);
  bx(.5,.012,.5,M(0x2b3140,.5,.2),.7,.18,0,nano);
  bx(.85,.3,.7,M(0xc9ced6,.3,.9),-2.75,.22,0,nano);
  bx(.3,.12,.3,M(0xd0d4da,.4,.8),-1.8,.13,.55,nano);
  bx(.07,.05,.12,M(0x3ddc97,.4,0,0x3ddc97),-.7,.1,.8,nano);
  bx(.07,.05,.12,M(0xffd21f,.4,0,0xffd21f),-.5,.1,.8,nano);
  const gold=M(0xe8b923,.3,1);
  for(let r=0;r<2;r++)for(let i=0;i<15;i++)bx(.07,.3,.07,gold,-2.38+i*.34,.17,r?.85:-.85,nano);

  /* OLED module */
  const oled=new THREE.Group();oled.position.set(0,1.45,-.55);rig.add(oled);
  bx(4.2,3.3,.12,M(0x0f141d,.5,.3),0,0,0,oled);
  bx(3.74,1.98,.06,M(0x04060a,.2,.5),0,.25,.09,oled);
  const tex=new THREE.CanvasTexture(canvasForTexture);tex.minFilter=THREE.LinearFilter;tex.generateMipmaps=false;
  const screen=new THREE.Mesh(new THREE.PlaneGeometry(3.52,1.76),new THREE.MeshBasicMaterial({map:tex}));screen.position.set(0,.25,.125);oled.add(screen);
  for(let i=0;i<7;i++)bx(.07,.34,.07,gold,-1.35+i*.45,-1.5,0,oled);

  /* wires */
  const wireMats=[];
  T.WIRES.forEach((w,i)=>{
    const sx=-1.35+i*.45,ex=-1.02+i*.34;
    const s=new THREE.Vector3(sx,1.45-1.67,-.55),e=new THREE.Vector3(ex,-1.75+.35,.5-.85);
    const pts=[s,new THREE.Vector3(sx,s.y-.35,s.z+.2),new THREE.Vector3((sx+ex)/2,-1.0,.15+i*.05),new THREE.Vector3(ex,e.y+.55,e.z+.05),e];
    const mat=M(new THREE.Color(w.c),.45,.1,new THREE.Color(w.c));mat.emissiveIntensity=.35;wireMats.push(mat);
    rig.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),40,.04,6,false),mat));
  });

  /* glow behind the screen */
  const gc=document.createElement("canvas");gc.width=gc.height=128;const gg=gc.getContext("2d");
  const grad=gg.createRadialGradient(64,64,4,64,64,64);grad.addColorStop(0,"rgba(255,210,31,.55)");grad.addColorStop(.5,"rgba(76,184,255,.28)");grad.addColorStop(1,"rgba(76,184,255,0)");gg.fillStyle=grad;gg.fillRect(0,0,128,128);
  const glowMat=new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(gc),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:.6});
  const glow=new THREE.Mesh(new THREE.PlaneGeometry(7.2,4.4),glowMat);glow.position.set(0,1.7,-.8);rig.add(glow);

  /* floor grid and drifting particles */
  const grid=new THREE.GridHelper(44,44,0x4cb8ff,0x4cb8ff);grid.position.y=-2.9;grid.material.transparent=true;scene.add(grid);
  const N=160,pos=new Float32Array(N*3),seed=[];
  for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*20;pos[i*3+1]=(Math.random()-.5)*10;pos[i*3+2]=-1-Math.random()*7;seed.push(Math.random()*6.28);}
  const pg=new THREE.BufferGeometry();pg.setAttribute("position",new THREE.BufferAttribute(pos,3));
  const pm=new THREE.PointsMaterial({size:.07,color:0x4cb8ff,transparent:true,opacity:.6,depthWrite:false});
  scene.add(new THREE.Points(pg,pm));

  const tar={x:0,y:0,rx:0,ry:0,s:1},cur={x:0,y:0,rx:0,ry:0,s:1};let px=0,py=0;
  window.addEventListener("pointermove",e=>{px=e.clientX/innerWidth-.5;py=e.clientY/innerHeight-.5;},{passive:true});
  function resize(){
    const w=window.innerWidth,h=window.innerHeight,a=w/h;
    renderer.setSize(w,h,false);camera.aspect=a;camera.position.set(0,.8,a<1?11/a:15);camera.lookAt(0,0,0);camera.updateProjectionMatrix();
  }
  function setTheme(){
    const d=isDark();grid.material.opacity=d?.16:.28;grid.material.color.set(d?0x4cb8ff:0x0a66c9);pm.color.set(d?0x4cb8ff:0x0a66c9);glowMat.opacity=d?.6:.18;
  }
  function setPose(id,side){
    const p=POSES[id]||POSES.setup,mob=window.innerWidth<900;
    tar.x=mob?0:p.x*side;tar.y=mob?p.y+1.2:p.y;tar.rx=p.rx;tar.ry=p.ry*side;tar.s=mob?p.s*.72:p.s;
  }
  function tick(now,drew){
    const k=reduceMotion?.2:.07;
    for(const q of ["x","y","rx","ry","s"])cur[q]+=(tar[q]-cur[q])*k;
    rig.position.set(cur.x,cur.y,0);
    rig.rotation.set(cur.rx+(reduceMotion?0:py*.1),cur.ry+(reduceMotion?0:px*.22+Math.sin(now/3200)*.035),0);
    rig.scale.setScalar(cur.s);
    wireMats.forEach((m,i)=>{m.emissiveIntensity=hoverWire<0?.35:(hoverWire===i?1.5:.08);});
    if(!reduceMotion){const a=pg.attributes.position;for(let i=0;i<N;i++)a.array[i*3+1]+=Math.sin(now/1800+seed[i])*.0025;a.needsUpdate=true;}
    if(drew)tex.needsUpdate=true;
    renderer.render(scene,camera);
  }
  window.addEventListener("resize",resize);resize();setTheme();
  return{tick,setPose,setTheme,resize,setHot:()=>{}};
}

/* ---------- init ---------- */
function onSection(id){
  activeSec=id;
  $$("[data-nav]").forEach(a=>a.setAttribute("aria-current",String(a.dataset.nav===id)));
  const side=li===2?-1:1;
  if(scene3d)scene3d.setPose(id,side);
  const k=kindFor(id);
  if(k){sceneLock=null;setSceneKind(k);}
  else if(!sceneLock)updateChips();
}
function init(){
  /* language and theme */
  const saved=store.get("nl-lang");
  const nav=(navigator.language||"en").slice(0,2);
  li=Math.max(0,LANGS.indexOf(saved||(nav==="ar"?"ar":nav==="fr"?"fr":"en")));
  const th=store.get("nl-theme");if(th==="dark"||th==="light")document.documentElement.setAttribute("data-theme",th);

  visIO=new IntersectionObserver(es=>es.forEach(e=>{const v=viewByEl.get(e.target);if(v)v.active=e.isIntersecting;}),{rootMargin:"80px"});
  viewDino=new DemoView($("#cvDino"),"dino");registerView(viewDino,$("#cvDino"));
  viewGame=new DemoView($("#cvGame"),gameKind);registerView(viewGame,$("#cvGame"));
  viewFace=new DemoView($("#cvFace"),"face");registerView(viewFace,$("#cvFace"));
  buildGallery();
  const off=document.createElement("canvas");sceneView=new DemoView(off,"dino");sceneView.active=true;
  buildWireSvg();
  renderAll();

  /* controls */
  $$("#langSeg button").forEach(b=>b.onclick=()=>{li=LANGS.indexOf(b.dataset.lang);store.set("nl-lang",b.dataset.lang);renderAll();onSection(activeSec);});
  $("#themeBtn").onclick=()=>{const next=isDark()?"light":"dark";document.documentElement.setAttribute("data-theme",next);store.set("nl-theme",next);if(scene3d)scene3d.setTheme();};
  if(window.matchMedia)matchMedia("(prefers-color-scheme: dark)").addEventListener&&matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(scene3d)scene3d.setTheme();});
  const jump=()=>viewDino.impl.jump();
  $("#cvDino").addEventListener("pointerdown",jump);
  $("#cvDino").addEventListener("keydown",e=>{if(e.code==="Space"||e.key===" "||e.key==="Enter"){e.preventDefault();jump();}});
  $("#dinoJump").onclick=jump;
  $("#dinoAuto").onclick=e=>{const on=e.currentTarget.getAttribute("aria-pressed")!=="true";e.currentTarget.setAttribute("aria-pressed",String(on));viewDino.impl.setAuto(on);};
  $("#cvFace").addEventListener("pointermove",e=>{const r=e.currentTarget.getBoundingClientRect();ROBO.gz=[clamp((e.clientX-r.left)/r.width*100,0,100),clamp((e.clientY-r.top)/r.height*100,0,100)];ROBO.gzAt=performance.now();});

  scene3d=initScene(sceneView.sc.cv);
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)onSection(e.target.id);}),{rootMargin:"-45% 0px -50% 0px"});
  $$("main > section").forEach(s=>io.observe(s));
  onSection("hero");
  if(scene3d&&!window.matchMedia("(max-width: 900px)").matches){/* snap the first pose without easing */}

  /* hero demo cycles through all six screens */
  const order=CHIPS.map(c=>c[0]);
  setInterval(()=>{if((activeSec==="hero"||activeSec==="how")&&!sceneLock&&!document.hidden){const i=order.indexOf(sceneView.kind);setSceneKind(order[(i+1)%order.length]);}},7000);

  let last=performance.now();
  (function loop(now){
    requestAnimationFrame(loop);
    if(document.hidden){last=now;return;}
    const dt=Math.min(100,now-last);last=now;
    for(const v of views)if(v.active)v.update(dt);
    const drew=sceneView.update(dt);
    if(scene3d)scene3d.tick(now,drew);
  })(performance.now());
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
</script>
